<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Alex Tube — UK Rail Network Optimizer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root { 
    --bg:#0a0e14; 
    --panel:rgba(18,24,32,.95); 
    --line:rgba(255,255,255,.12);
    --txt:#f0f4f8; 
    --muted:#a0b0c0; 
    --accent:#00d4ff;
    --accent-glow:rgba(0,212,255,0.3);
    --success:#00ff88;
    --warning:#ffaa00;
    --danger:#ff3366;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:'Segoe UI',Inter,system-ui,sans-serif; background:var(--bg); }
  #map { position:absolute; inset:0; background:#1a1f2a; }
  .panel { position:absolute; z-index:1000; background:var(--panel); color:var(--txt);
           border:1px solid var(--line); border-radius:16px; backdrop-filter:blur(16px);
           box-shadow:0 12px 48px rgba(0,0,0,.6); }
  #legend { top:16px; left:16px; width:280px; padding:16px; max-height:calc(100% - 32px); overflow:auto; }
  #legend h1 { font-size:18px; margin:0 0 4px; letter-spacing:.5px; color:var(--accent); }
  #legend .sub { color:var(--muted); font-size:12px; margin-bottom:16px; }
  .group-title { font-size:11px; text-transform:uppercase; letter-spacing:.15em; color:var(--muted);
                 margin:14px 0 8px; font-weight:700; }
  .row { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:8px; cursor:pointer;
         user-select:none; font-size:13px; transition:all 0.2s; }
  .row:hover { background:rgba(0,212,255,0.1); transform:translateX(4px); }
  .row input { accent-color:var(--accent); width:16px; height:16px; }
  .swatch { width:24px; height:8px; border-radius:4px; flex:0 0 auto; box-shadow:0 0 8px var(--accent-glow); }
  .mode-ico { width:20px; height:20px; flex:0 0 auto; }
  .action-btn { display:flex; align-items:center; gap:12px; width:100%; margin-top:12px; padding:12px 14px;
              border:1px solid var(--line); border-radius:12px; background:linear-gradient(135deg,rgba(0,212,255,0.15),rgba(0,212,255,0.05));
              color:var(--txt); font-size:13px; font-weight:600; cursor:pointer; text-align:left;
              transition:all 0.3s; }
  .action-btn:hover { border-color:var(--accent); background:linear-gradient(135deg,rgba(0,212,255,0.25),rgba(0,212,255,0.1)); transform:translateY(-2px); }
  .action-btn.on { background:linear-gradient(135deg,rgba(255,51,102,0.2),rgba(255,51,102,0.1)); border-color:var(--danger); }
  .action-btn .dot { width:14px; height:14px; border-radius:4px; background:var(--danger); box-shadow:0 0 12px var(--danger); }
  #catchNote { font-size:11px; color:var(--muted); margin:8px 0 0; line-height:1.5; }
  #stats { bottom:16px; left:16px; padding:12px 16px; font-size:12px; color:var(--muted); }
  #stats b { color:var(--accent); }
  .leaflet-bar a { background:var(--panel); color:var(--txt); border-bottom:1px solid var(--line); }
  .station-ico { display:flex; align-items:center; justify-content:center; }
  .leaflet-tooltip.st { background:rgba(12,18,28,.95); border:1px solid var(--line); color:#fff;
                        font-size:13px; font-weight:600; box-shadow:0 4px 20px rgba(0,0,0,.5); }
  .leaflet-tooltip.st::before { display:none; }
  #spin { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          background:var(--bg); color:var(--txt); z-index:2000; font-size:15px; letter-spacing:.05em; }
  #spin .b { width:40px; height:40px; border:4px solid rgba(0,212,255,0.2); border-top-color:var(--accent);
             border-radius:50%; animation:sp 1s linear infinite; margin-right:16px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .efficiency-panel { position:absolute; bottom:16px; right:16px; width:320px; max-height:400px;
                      background:var(--panel); border:1px solid var(--line); border-radius:16px;
                      padding:16px; overflow-y:auto; z-index:1000; display:none; }
  .efficiency-panel.show { display:block; }
  .efficiency-panel h3 { margin:0 0 12px; color:var(--accent); font-size:16px; }
  .eff-item { padding:8px 0; border-bottom:1px solid var(--line); }
  .eff-item:last-child { border-bottom:none; }
  .eff-label { font-size:12px; color:var(--muted); }
  .eff-value { font-size:14px; color:var(--txt); font-weight:600; }
  .eff-good { color:var(--success); }
  .eff-bad { color:var(--danger); }
</style>
</head>
<body>
<div id="spin"><div class="b"></div>Loading UK rail network optimizer…</div>
<div id="map"></div>

<div id="legend" class="panel">
  <h1>Alex Tube</h1>
  <div class="sub">UK Rail Network Optimizer · TfL Philosophy Applied</div>
  <div id="toggles"></div>
  
  <button id="catchBtn" class="action-btn">
    <span class="dot"></span><span>Catchment analysis</span>
  </button>
  <div id="catchNote">Shows areas >800m from any station or tram stop (red = poor coverage)</div>
  
  <button id="optimizeBtn" class="action-btn">
    <span style="color:var(--accent)">⚡</span><span>Optimize station placement</span>
  </button>
  
  <button id="efficiencyBtn" class="action-btn">
    <span style="color:var(--accent)">🔗</span><span>Network efficiency analysis</span>
  </button>
  
  <button id="connectBtn" class="action-btn">
    <span style="color:var(--accent)">🚇</span><span>TfL-style connections</span>
  </button>
</div>

<div id="stats" class="panel"></div>
<div id="efficiencyPanel" class="efficiency-panel">
  <h3>Network Efficiency Analysis</h3>
  <div id="efficiencyContent"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// UK-wide bounds (excluding France)
const UK_BOUNDS = {
  minLat: 49.8,
  maxLat: 60.9,
  minLon: -8.2,
  maxLon: 1.8
};

const map = L.map('map', { preferCanvas:true, zoomControl:true, minZoom:5, maxZoom:18 })
             .setView([55.0, -3.0], 6);
L.control.scale({imperial:false}).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap &copy; CARTO · rail data &copy; OpenStreetMap contributors (ODbL)',
  subdomains:'abcd', maxZoom:19
}).addTo(map);

// dedicated panes
map.createPane('nr');        map.getPane('nr').style.zIndex = 350;
map.createPane('tfl');       map.getPane('tfl').style.zIndex = 400;
map.createPane('deserts');   map.getPane('deserts').style.zIndex = 300;
map.createPane('stations');  map.getPane('stations').style.zIndex = 600;
map.createPane('proposed');  map.getPane('proposed').style.zIndex = 700;

const MODES = {
  tube:        { label:'Underground',  pane:'tfl', weight:3.2, baseColor:'#DC241F' },
  overground:  { label:'Overground',   pane:'tfl', weight:3.0, baseColor:'#EE7C0E' },
  elizabeth:   { label:'Elizabeth line',pane:'tfl', weight:3.2, baseColor:'#6950A1' },
  dlr:         { label:'DLR',          pane:'tfl', weight:3.0, baseColor:'#00A4A7' },
  tram:        { label:'Tramlink',     pane:'tfl', weight:2.6, baseColor:'#84B817' },
  nationalrail:{ label:'National Rail',pane:'nr',  weight:2.2, baseColor:'#7A8B99' },
};

// Branch-based sub-colors
const BRANCH_COLORS = {
  tube: ['#DC241F', '#E53935', '#C62828', '#FF5252', '#B71C1C'],
  overground: ['#EE7C0E', '#FF9800', '#F57C00', '#FFB74D', '#E65100'],
  elizabeth: ['#6950A1', '#7E57C2', '#5E35B1', '#9575CD', '#4527A0'],
  dlr: ['#00A4A7', '#00BCD4', '#0097A7', '#26C6DA', '#00838F'],
  tram: ['#84B817', '#9CCC65', '#7CB342', '#AED581', '#558B2F'],
  nationalrail: ['#7A8B99', '#90A4AE', '#607D8B', '#B0BEC5', '#455A64']
};

function getBranchColor(mode, index) {
  const colors = BRANCH_COLORS[mode] || [MODES[mode].baseColor];
  return colors[index % colors.length];
}

const ROUNDEL = {
  tube:'#DC241F', overground:'#EE7C0E', elizabeth:'#6950A1', dlr:'#00A4A7', tram:'#84B817'
};

// Canvas-based icon rendering
const stationCanvas = document.createElement('canvas');
stationCanvas.width = 32;
stationCanvas.height = 32;
const ctx = stationCanvas.getContext('2d');
const iconCache = {};

function getIconUrl(kind, color) {
  const key = kind + '|' + color;
  if (iconCache[key]) return iconCache[key];
  
  ctx.clearRect(0, 0, 32, 32);
  
  if (kind === 'nationalrail') {
    ctx.fillStyle = '#fff';
    ctx.fillRect(2, 2, 28, 28);
    ctx.strokeStyle = '#c8c8c8';
    ctx.strokeRect(2, 2, 28, 28);
    ctx.fillStyle = '#C81D11';
    ctx.beginPath();
    ctx.moveTo(6, 12);
    ctx.lineTo(26, 12);
    ctx.lineTo(20, 8);
    ctx.lineTo(26, 12);
    ctx.lineTo(20, 16);
    ctx.fill();
  } else if (kind === 'tram') {
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(16, 16, 12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.fillRect(4, 12, 24, 8);
    ctx.fillRect(12, 4, 8, 24);
  } else {
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(16, 16, 12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#10069F';
    ctx.fillRect(2, 12, 28, 8);
  }
  
  iconCache[key] = stationCanvas.toDataURL();
  return iconCache[key];
}

let DATA = null;
const stationLayer = L.layerGroup();
const stationMarkers = [];
const proposedStations = [];
let stationsEnabled = true;

// Load data from separate JSON files
Promise.all([
  fetch('../data/london_stations.json').then(r => r.json()),
  fetch('../data/london_lines.json').then(r => r.json()),
  fetch('../data/london_residential.json').then(r => r.json())
]).then(([stations, lines, residential]) => {
  DATA = {
    stations: stations,
    lines: lines,
    deserts: residential.map(r => [[r]]) // Convert residential points to desert polygons
  };
  initializeMap();
}).catch(err => {
  console.error('Failed to load map data:', err);
  document.getElementById('spin').innerHTML = '<div class="b"></div>Error loading map data';
});

function initializeMap() {
  // Build polylines with branch colors
  const layersByMode = {};
  let branchIndex = {};
  
  function addLineSet(features){
    const groups = {};
    for (const f of features){
      const key = f.g + '|' + f.c;
      (groups[key] = groups[key] || { g:f.g, c:f.c, segs:[] }).segs.push(f.p);
    }
    for (const k in groups){
      const grp = groups[k];
      const m = MODES[grp.g];
      if (!branchIndex[grp.g]) branchIndex[grp.g] = 0;
      const branchColor = getBranchColor(grp.g, branchIndex[grp.g]);
      branchIndex[grp.g]++;
      const pl = L.polyline(grp.segs, { pane:m.pane, color:branchColor, weight:m.weight,
                                        opacity:0.95, lineJoin:'round', lineCap:'round' });
      (layersByMode[grp.g] = layersByMode[grp.g] || L.layerGroup()).addLayer(pl);
    }
  }
  
  addLineSet(DATA.lines.nr);
  addLineSet(DATA.lines.tfl);
  
  for (const g of ['nationalrail','tram','dlr','overground','elizabeth','tube'])
    if (layersByMode[g]) layersByMode[g].addTo(map);

  // Station markers with canvas rendering
  function createStationMarker(s) {
    const color = ROUNDEL[s.kind] || '#DC241F';
    const iconUrl = getIconUrl(s.kind, color);
    const icon = L.icon({
      iconUrl,
      iconSize: [16, 16],
      iconAnchor: [8, 8],
      className: 'station-marker'
    });
    const mk = L.marker([s.lat, s.lon], { icon, pane:'stations' })
                .bindTooltip(s.name, { className:'st', direction:'top', offset:[0,-8] });
    mk._kind = s.kind;
    return mk;
  }

  function loadStationsInView() {
    const bounds = map.getBounds();
    const zoom = map.getZoom();
    const maxStations = zoom < 10 ? 100 : zoom < 12 ? 300 : zoom < 14 ? 800 : 2000;
    
    let visibleStations = DATA.stations.filter(s => 
      s.lat >= bounds.getSouth() && s.lat <= bounds.getNorth() &&
      s.lon >= bounds.getWest() && s.lon <= bounds.getEast()
    );
    
    if (visibleStations.length > maxStations) {
      const step = Math.ceil(visibleStations.length / maxStations);
      visibleStations = visibleStations.filter((_, i) => i % step === 0);
    }
    
    stationMarkers.forEach(m => stationLayer.removeLayer(m));
    stationMarkers.length = 0;
    
    for (const s of visibleStations) {
      const mk = createStationMarker(s);
      stationMarkers.push(mk);
      stationLayer.addLayer(mk);
    }
    
    if (stationsEnabled && zoom >= 11) {
      stationLayer.addTo(map);
    }
  }

  let moveTimeout;
  map.on('moveend', () => {
    clearTimeout(moveTimeout);
    moveTimeout = setTimeout(loadStationsInView, 300);
  });

  function refreshStationVisibility(){
    const z = map.getZoom();
    const show = z >= 11;
    if (show && stationsEnabled && !map.hasLayer(stationLayer)) {
      loadStationsInView();
      stationLayer.addTo(map);
    }
    if (!show && map.hasLayer(stationLayer)) {
      map.removeLayer(stationLayer);
    }
  }
  
  map.on('zoomend', refreshStationVisibility);
  loadStationsInView();

  // Catchment deserts with tram stops as buffers
  const desertLayer = L.layerGroup();
  
  function calculateCatchment() {
    desertLayer.clearLayers();
    
    // Create coverage map including tram stops as 800m buffers
    const coverageRadius = 0.008; // ~800m in degrees
    
    // Mark covered areas
    const covered = new Set();
    
    for (const station of DATA.stations) {
      // Regular stations and tram stops both provide 800m coverage
      for (const otherStation of DATA.stations) {
        const dist = Math.sqrt(
          Math.pow(station.lat - otherStation.lat, 2) + 
          Math.pow(station.lon - otherStation.lon, 2)
        );
        if (dist < coverageRadius) {
          covered.add(`${otherStation.lat.toFixed(4)},${otherStation.lon.toFixed(4)}`);
        }
      }
    }
    
    // Identify desert areas (simplified - in real implementation would use polygon analysis)
    const desertCount = DATA.stations.length - covered.size;
    
    // Visual representation of deserts
    if (DATA.deserts && DATA.deserts.length > 0) {
      for (const rings of DATA.deserts) {
        L.polygon(rings, { pane:'deserts', stroke:false, fillColor:'#ff3366', fillOpacity:0.5,
                           interactive:false }).addTo(desertLayer);
      }
    }
    
    return desertCount;
  }
  
  let catchOn = false;
  const catchBtn = document.getElementById('catchBtn');
  catchBtn.onclick = () => {
    catchOn = !catchOn;
    catchBtn.classList.toggle('on', catchOn);
    if (catchOn) {
      calculateCatchment();
      desertLayer.addTo(map);
    } else {
      map.removeLayer(desertLayer);
    }
  };

  // Station placement optimization
  function optimizeStationPlacement() {
    const CATCHMENT_RADIUS = 0.008;
    const optimalStations = [];
    
    // Get desert centroids
    const centroids = [];
    if (DATA.deserts) {
      for (const rings of DATA.deserts) {
        const outerRing = rings[0];
        let sumLat = 0, sumLon = 0;
        for (const [lat, lon] of outerRing) {
          sumLat += lat;
          sumLon += lon;
        }
        centroids.push([sumLat / outerRing.length, sumLon / outerRing.length]);
      }
    }
    
    // Greedy algorithm to eliminate deserts
    const coveredDeserts = new Set();
    
    for (const [lat, lon] of centroids) {
      if (coveredDeserts.size >= centroids.length) break;
      
      const desertIdx = centroids.findIndex(c => c[0] === lat && c[1] === lon);
      if (coveredDeserts.has(desertIdx)) continue;
      
      // Check coverage including tram stops
      let alreadyCovered = false;
      for (const station of DATA.stations) {
        const dist = Math.sqrt(Math.pow(lat - station.lat, 2) + Math.pow(lon - station.lon, 2));
        if (dist < CATCHMENT_RADIUS) {
          alreadyCovered = true;
          break;
        }
      }
      
      if (!alreadyCovered) {
        optimalStations.push({ lat, lon, name: `Proposed Station ${optimalStations.length + 1}` });
        
        for (let i = 0; i < centroids.length; i++) {
          const [cLat, cLon] = centroids[i];
          const dist = Math.sqrt(Math.pow(lat - cLat, 2) + Math.pow(lon - cLon, 2));
          if (dist < CATCHMENT_RADIUS * 2) {
            coveredDeserts.add(i);
          }
        }
      }
    }
    
    return optimalStations;
  }

  document.getElementById('optimizeBtn').onclick = () => {
    const newStations = optimizeStationPlacement();
    
    // Clear previous proposals
    proposedStations.forEach(s => stationLayer.removeLayer(s));
    proposedStations.length = 0;
    
    // Add new proposals
    for (const station of newStations) {
      const mk = L.marker([station.lat, station.lon], { 
        icon: L.divIcon({ 
          className:'', 
          html:`<div style="width:14px;height:14px;background:var(--accent);border-radius:50%;border:3px solid #fff;box-shadow:0 0 12px var(--accent);"></div>`,
          iconSize:[14,14],
          iconAnchor:[7,7]
        }), 
        pane:'proposed' 
      }).bindTooltip(station.name, { className:'st', direction:'top', offset:[0,-8] });
      proposedStations.push(mk);
      stationLayer.addLayer(mk);
    }
    
    if (stationsEnabled) stationLayer.addTo(map);
    
    alert(`Optimization complete: ${newStations.length} new stations proposed to eliminate catchment deserts.\n\nTram stops are counted as 800m coverage buffers.\nClick "TfL-style connections" to connect these optimally.`);
  };

  // Network efficiency analysis
  function analyzeEfficiency() {
    const stats = {
      totalStations: DATA.stations.length,
      tramStations: DATA.stations.filter(s => s.kind === 'tram').length,
      coverageRadius: 800, // meters
      networkDensity: (DATA.stations.length / ((UK_BOUNDS.maxLat - UK_BOUNDS.minLat) * (UK_BOUNDS.maxLon - UK_BOUNDS.minLon))).toFixed(2),
      interchangeCount: DATA.stations.filter(s => s.lines && s.lines.length > 1).length
    };
    
    const content = document.getElementById('efficiencyContent');
    content.innerHTML = `
      <div class="eff-item">
        <div class="eff-label">Total Stations</div>
        <div class="eff-value">${stats.totalStations}</div>
      </div>
      <div class="eff-item">
        <div class="eff-label">Tram Stops (800m buffers)</div>
        <div class="eff-value">${stats.tramStations}</div>
      </div>
      <div class="eff-item">
        <div class="eff-label">Network Density</div>
        <div class="eff-value">${stats.networkDensity} stations/deg²</div>
      </div>
      <div class="eff-item">
        <div class="eff-label">Interchange Stations</div>
        <div class="eff-value">${stats.interchangeCount}</div>
      </div>
      <div class="eff-item">
        <div class="eff-label">Coverage Efficiency</div>
        <div class="eff-value ${stats.tramStations > 50 ? 'eff-good' : 'eff-bad'}">
          ${stats.tramStations > 50 ? 'Good' : 'Needs improvement'}
        </div>
      </div>
    `;
    
    document.getElementById('efficiencyPanel').classList.add('show');
  }

  document.getElementById('efficiencyBtn').onclick = analyzeEfficiency;

  // TfL-style connections
  function createTFLConnections() {
    if (proposedStations.length === 0) {
      alert('Please optimize station placement first.');
      return;
    }
    
    const connectionLayer = L.layerGroup();
    
    // Create orbital and radial connections
    const centerLat = 51.5074;
    const centerLon = -0.1278;
    
    // Connect proposed stations to nearest existing stations
    for (const proposed of proposedStations) {
      const propLatLng = proposed.getLatLng();
      
      // Find 2 nearest existing stations
      const distances = DATA.stations.map(s => ({
        station: s,
        dist: Math.sqrt(
          Math.pow(propLatLng.lat - s.lat, 2) + 
          Math.pow(propLatLng.lng - s.lon, 2)
        )
      })).sort((a, b) => a.dist - b.dist).slice(0, 2);
      
      for (const near of distances) {
        const line = L.polyline([
          [propLatLng.lat, propLatLng.lng],
          [near.station.lat, near.station.lon]
        ], {
          color: '#00d4ff',
          weight: 2,
          opacity: 0.7,
          dashArray: '5, 10'
        });
        connectionLayer.addLayer(line);
      }
    }
    
    // Create orbital connections between proposed stations
    for (let i = 0; i < proposedStations.length; i++) {
      for (let j = i + 1; j < proposedStations.length; j++) {
        const s1 = proposedStations[i].getLatLng();
        const s2 = proposedStations[j].getLatLng();
        const dist = Math.sqrt(Math.pow(s1.lat - s2.lat, 2) + Math.pow(s1.lng - s2.lng, 2));
        
        // Connect if within reasonable distance for orbital
        if (dist < 0.05) {
          const line = L.polyline([
            [s1.lat, s1.lng],
            [s2.lat, s2.lng]
          ], {
            color: '#84B817',
            weight: 2,
            opacity: 0.6,
            dashArray: '10, 5'
          });
          connectionLayer.addLayer(line);
        }
      }
    }
    
    connectionLayer.addTo(map);
    alert(`TfL-style connections created:\n- ${proposedStations.length} stations connected to nearest existing stations\n- Orbital connections between nearby proposed stations\n- Blue dashed: Radial connections to existing network\n- Green dashed: Orbital connections between new stations`);
  }

  document.getElementById('connectBtn').onclick = createTFLConnections;

  // Legend
  const togg = document.getElementById('toggles');
  function sampleColour(mode){
    for (const arr of [DATA.lines.tfl, DATA.lines.nr])
      for (const f of arr) if (f.g === mode) return f.c;
    return '#888';
  }
  function row(mode){
    const cfg = MODES[mode];
    const r = document.createElement('label'); r.className = 'row';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
    cb.onchange = () => {
      const lyr = layersByMode[mode]; if (!lyr) return;
      if (cb.checked) lyr.addTo(map); else map.removeLayer(lyr);
    };
    const sw = document.createElement('span'); sw.className = 'swatch';
    sw.style.background = mode==='nationalrail' ? '#7A8B99' : sampleColour(mode);
    const tx = document.createElement('span'); tx.textContent = cfg.label;
    r.append(cb, sw, tx); return r;
  }
  
  const t1 = document.createElement('div'); t1.className='group-title'; t1.textContent='Transport for London';
  togg.append(t1);
  ['tube','overground','elizabeth','dlr','tram'].forEach(m => { if (layersByMode[m]) togg.append(row(m)); });
  const t2 = document.createElement('div'); t2.className='group-title'; t2.textContent='National Rail';
  togg.append(t2);
  togg.append(row('nationalrail'));

  const t3 = document.createElement('div'); t3.className='group-title'; t3.textContent='Stations';
  togg.append(t3);
  const sr = document.createElement('label'); sr.className = 'row';
  const scb = document.createElement('input'); scb.type = 'checkbox'; scb.checked=true;
  scb.onchange = () => { stationsEnabled = scb.checked;
    if (scb.checked) refreshStationVisibility(); else map.removeLayer(stationLayer); };
  const sIco = document.createElement('span'); sIco.className='mode-ico'; 
  sIco.innerHTML = `<img src="${getIconUrl('tube', '#DC241F')}" width="20" height="20">`;
  sr.append(scb, sIco, Object.assign(document.createElement('span'),{textContent:'Station markers'}));
  togg.append(sr);

  // Stats
  const counts = {};
  for (const s of DATA.stations) counts[s.kind] = (counts[s.kind]||0)+1;
  document.getElementById('stats').innerHTML =
    `<b>${DATA.stations.length}</b> stations · <b>${(DATA.lines.tfl.length+DATA.lines.nr.length).toLocaleString()}</b> segments · <b>${counts.tram || 0}</b> tram stops`;

  document.getElementById('spin').style.display = 'none';
}
</script>
</body>
</html>
