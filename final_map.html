<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex Tube — UK Rail Network Optimizer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0a0e14;
      --panel: rgba(18, 24, 32, .95);
      --line: rgba(255, 255, 255, .12);
      --txt: #f0f4f8;
      --muted: #a0b0c0;
      --accent: #00d4ff;
      --accent-glow: rgba(0, 212, 255, 0.3);
      --success: #00ff88;
      --warning: #ffaa00;
      --danger: #ff3366;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: 'Segoe UI', Inter, system-ui, sans-serif;
      background: var(--bg);
    }

    #map {
      position: absolute;
      inset: 0;
      background: #1a1f2a;
    }

    .panel {
      position: absolute;
      z-index: 1000;
      background: var(--panel);
      color: var(--txt);
      border: 1px solid var(--line);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 48px rgba(0, 0, 0, .6);
    }

    #legend {
      top: 16px;
      left: 16px;
      width: 280px;
      padding: 16px;
      max-height: calc(100% - 32px);
      overflow: auto;
    }

    #legend h1 {
      font-size: 18px;
      margin: 0 0 4px;
      letter-spacing: .5px;
      color: var(--accent);
    }

    #legend .sub {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
    }

    .group-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .15em;
      color: var(--muted);
      margin: 14px 0 8px;
      font-weight: 700;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      transition: all 0.2s;
    }

    .row:hover {
      background: rgba(0, 212, 255, 0.1);
      transform: translateX(4px);
    }

    .row input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
    }

    .swatch {
      width: 24px;
      height: 8px;
      border-radius: 4px;
      flex: 0 0 auto;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .mode-ico {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 212, 255, 0.05));
      color: var(--txt);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s;
    }

    .action-btn:hover {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.25), rgba(0, 212, 255, 0.1));
      transform: translateY(-2px);
    }

    .action-btn.on {
      background: linear-gradient(135deg, rgba(255, 51, 102, 0.2), rgba(255, 51, 102, 0.1));
      border-color: var(--danger);
    }

    .action-btn .dot {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: var(--danger);
      box-shadow: 0 0 12px var(--danger);
    }

    #catchNote {
      font-size: 11px;
      color: var(--muted);
      margin: 8px 0 0;
      line-height: 1.5;
    }

    #stats {
      bottom: 16px;
      left: 16px;
      padding: 12px 16px;
      font-size: 12px;
      color: var(--muted);
    }

    #stats b {
      color: var(--accent);
    }

    .leaflet-bar a {
      background: var(--panel);
      color: var(--txt);
      border-bottom: 1px solid var(--line);
    }

    .station-ico {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .leaflet-tooltip.st {
      background: rgba(12, 18, 28, .95);
      border: 1px solid var(--line);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .5);
    }

    .leaflet-tooltip.st::before {
      display: none;
    }

    #spin {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--txt);
      z-index: 2000;
      font-size: 15px;
      letter-spacing: .05em;
    }

    #spin .b {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 212, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: sp 1s linear infinite;
      margin-right: 16px;
    }

    @keyframes sp {
      to {
        transform: rotate(360deg);
      }
    }

    .efficiency-panel {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 320px;
      max-height: 400px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }

    .efficiency-panel.show {
      display: block;
    }

    .efficiency-panel h3 {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 16px;
    }

    .eff-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }

    .eff-item:last-child {
      border-bottom: none;
    }

    .eff-label {
      font-size: 12px;
      color: var(--muted);
    }

    .eff-value {
      font-size: 14px;
      color: var(--txt);
      font-weight: 600;
    }

    .eff-good {
      color: var(--success);
    }

    .eff-bad {
      color: var(--danger);
    }

    /* New multi‑roundel icon style */
    .multi-roundel {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2px;
    }

    .multi-roundel img {
      height: 24px;
      width: auto;
      image-rendering: auto;
    }

    /* White shadow for readability on dark map */
    .station-marker-wrapper {
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
    }

    .multi-roundel-icon {
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      background: none !important;
    }
  </style>
</head>

<body>
  <div id="spin">
    <div class="b"></div>Loading UK rail network optimizer…
  </div>
  <div id="map"></div>

  <div id="legend" class="panel">
    <h1>Alex Tube</h1>
    <div class="sub">UK Rail Network Optimizer · TfL Philosophy Applied</div>
    <div id="toggles"></div>

    <button id="catchBtn" class="action-btn">
      <span class="dot"></span><span>Catchment analysis</span>
    </button>
    <div id="catchNote">Shows areas >800m from any station or tram stop (red = poor coverage)</div>

    <button id="optimizeBtn" class="action-btn">
      <span style="color:var(--accent)">⚡</span><span>Optimize station placement</span>
    </button>

    <button id="efficiencyBtn" class="action-btn">
      <span style="color:var(--accent)">🔗</span><span>Network efficiency analysis</span>
    </button>

    <button id="connectBtn" class="action-btn">
      <span style="color:var(--accent)">🚇</span><span>TfL-style connections</span>
    </button>
  </div>

  <div id="stats" class="panel"></div>
  <div id="efficiencyPanel" class="efficiency-panel">
    <h3>Network Efficiency Analysis</h3>
    <div id="efficiencyContent"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    // Pre-encode all roundel SVGs to base64 once at load time
    for (const key in ROUNDEL_SVGS) {
      ROUNDEL_SVGS[key] = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(ROUNDEL_SVGS[key])));
    }

    const NATIONAL_RAIL_SVG_BASE64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 39"><g stroke="#ED1C24" fill="none"><path d="M1,-8.9 46,12.4 16,26.6 61,47.9" stroke-width="6"/><path d="M0,12.4H62m0,14.2H0" stroke-width="6.4"/></g></svg>`)));

    function getSvgDataUrl(svgName) {
      if (ROUNDEL_SVGS[svgName]) {
        return ROUNDEL_SVGS[svgName];
      }
      return '';
    }

    function showNotification(msg) {
      const note = document.createElement('div');
      note.className = 'panel';
      note.style.position = 'absolute';
      note.style.top = '80px';
      note.style.left = '50%';
      note.style.transform = 'translateX(-50%)';
      note.style.padding = '10px 20px';
      note.style.zIndex = 3000;
      note.textContent = msg;
      document.body.appendChild(note);
      setTimeout(() => note.remove(), 3000);
    }

    function getStationRoundelHtml(station) {
      const lines = station.lines || [];
      const roundels = [];

      if (station.kind === 'nationalrail') {
        roundels.push('nationalrail');
      } else if (station.kind === 'tram') {
        roundels.push('tramlink');
      } else if (station.kind === 'dlr') {
        roundels.push('dlr');
      } else if (station.kind === 'overground') {
        roundels.push('overground');
      } else if (station.kind === 'elizabeth') {
        roundels.push('elizabeth');
      } else if (station.kind === 'tube') {
        const tubeLines = lines;
        let addedTube = false;
        for (const rawLine of tubeLines) {
          const line = rawLine.toLowerCase();
          if (line.includes('bakerloo')) { roundels.push('bakerloo'); addedTube = true; }
          else if (line.includes('central')) { roundels.push('central'); addedTube = true; }
          else if (line.includes('circle')) { roundels.push('circle'); addedTube = true; }
          else if (line.includes('district')) { roundels.push('district'); addedTube = true; }
          else if (line.includes('hammersmith') || line.includes('city')) { roundels.push('hammersmith_city'); addedTube = true; }
          else if (line.includes('jubilee')) { roundels.push('jubilee'); addedTube = true; }
          else if (line.includes('metropolitan')) { roundels.push('metropolitan'); addedTube = true; }
          else if (line.includes('northern')) { roundels.push('northern'); addedTube = true; }
          else if (line.includes('piccadilly')) { roundels.push('piccadilly'); addedTube = true; }
          else if (line.includes('victoria')) { roundels.push('victoria'); addedTube = true; }
          else if (line.includes('waterloo')) { roundels.push('circle'); addedTube = true; } // Fallback Waterloo & City
        }
        if (!addedTube) {
          roundels.push('underground');
        }
      }

      const uniqueRoundels = Array.from(new Set(roundels));

      let html = `<div class="multi-roundel station-marker-wrapper" style="transform: translate(-50%, -50%);">`;
      for (const r of uniqueRoundels) {
        if (r === 'nationalrail') {
          html += `<img src="${NATIONAL_RAIL_SVG_BASE64}" style="height: 24px; width: auto;" />`;
        } else {
          const src = getSvgDataUrl(r) || getSvgDataUrl('underground');
          html += `<img src="${src}" style="height: 24px;" />`;
        }
      }
      html += `</div>`;
      return html;
    }

    // ---------------------------------------------------------------------------
    // Global state
    // ---------------------------------------------------------------------------
    let DATA = null;
    const stationLayer = L.layerGroup();
    const stationMarkers = [];
    const proposedStations = [];
    let stationsEnabled = true;

    // ---------------------------------------------------------------------------
    // Data loading
    // ---------------------------------------------------------------------------
    function filterFranceAndEurotunnel(features) {
      if (!features || !Array.isArray(features)) return [];
      return features.map(line => {
        if (line.n && line.n.includes("Eurostar")) {
          return null;
        }
        // Filter out coordinates where lat < 51.06 && lon > 1.15 (France and French Eurotunnel side)
        const newP = line.p.filter(pt => !(pt[0] < 51.06 && pt[1] > 1.15));
        if (newP.length < 2) return null;
        return { ...line, p: newP };
      }).filter(Boolean);
    }

    Promise.all([
      fetch('../data/london_stations.json').then(r => r.json()),
      fetch('../data/london_lines.json').then(r => r.json()),
      fetch('../data/london_residential.json').then(r => r.json())
    ]).then(([stations, lines, residential]) => {
      // 1. Filter out France and Eurotunnel lines/coordinates
      lines.nr = filterFranceAndEurotunnel(lines.nr);
      lines.tfl = filterFranceAndEurotunnel(lines.tfl);

      // 2. Pre-calculate bounding box for each line for ultra-fast spatial search
      const allLines = [...lines.tfl, ...lines.nr];
      for (const line of allLines) {
        let minLat = Infinity, maxLat = -Infinity;
        let minLon = Infinity, maxLon = -Infinity;
        for (const pt of line.p) {
          if (pt[0] < minLat) minLat = pt[0];
          if (pt[0] > maxLat) maxLat = pt[0];
          if (pt[1] < minLon) minLon = pt[1];
          if (pt[1] > maxLon) maxLon = pt[1];
        }
        line.bbox = { minLat, maxLat, minLon, maxLon };
      }

      // 3. Populate served lines dynamically for each station
      for (const s of stations) {
        s.lines = [];
        const margin = 0.002; // Bounding box margin (~220m)
        const thresholdSq = 0.000004; // Max distance squared (~220m squared)

        for (const line of allLines) {
          if (s.lat < line.bbox.minLat - margin || s.lat > line.bbox.maxLat + margin ||
            s.lon < line.bbox.minLon - margin || s.lon > line.bbox.maxLon + margin) {
            continue;
          }

          let matches = false;
          for (const pt of line.p) {
            const dLat = pt[0] - s.lat;
            const dLon = pt[1] - s.lon;
            if (dLat * dLat + dLon * dLon < thresholdSq) {
              matches = true;
              break;
            }
          }

          if (matches) {
            if (line.n) s.lines.push(line.n);
          }
        }
        // Unique lines list
        s.lines = Array.from(new Set(s.lines));
      }

      // Normalise desert polygons
      let deserts = [];
      if (Array.isArray(residential)) {
        deserts = residential.map(ring => {
          if (Array.isArray(ring) && ring.length > 0 && Array.isArray(ring[0]) && typeof ring[0][0] === 'number') {
            return [ring];
          }
          return ring;
        });
      } else if (residential && residential.type === 'FeatureCollection') {
        deserts = residential.features
          .filter(f => f.geometry && f.geometry.type === 'Polygon')
          .map(f => f.geometry.coordinates);
      } else {
        console.warn('Residential data format not recognised – catchment analysis will use on‑the‑fly computation.');
        deserts = [];
      }

      DATA = {
        stations: stations,
        lines: lines,
        deserts: deserts,
        // Extract centroids from desert polygons for quick spatial filtering
        desertCentroids: deserts.map((ring, idx) => {
          const poly = turf.polygon(ring);
          const centroid = turf.centroid(poly);
          return { lat: centroid.geometry.coordinates[1], lon: centroid.geometry.coordinates[0], index: idx };
        })
      };

      initializeMap();
    }).catch(err => {
      console.error('Failed to load map data:', err);
      document.getElementById('spin').innerHTML = '<div class="b"></div>Error loading map data';
    });

    // ---------------------------------------------------------------------------
    // Main initialisation (called after data is ready)
    // ---------------------------------------------------------------------------
    function initializeMap() {
      // ---- Build line layers, preserving colours from the data ----
      const layersByMode = {};

      /**
       * Groups line features by mode and colour, then creates Leaflet polylines.
       * @param {Array} features - Array of {g: mode, c: colour, p: array of coordinates}
       */
      function addLineSet(features) {
        const groups = {};
        for (const f of features) {
          const key = f.g + '|' + (f.c || 'default');
          (groups[key] = groups[key] || { g: f.g, c: f.c, segs: [] }).segs.push(f.p);
        }

        for (const k in groups) {
          const grp = groups[k];
          const modeConfig = MODES[grp.g];
          const lineColor = grp.c || modeConfig.baseColor;
          const polyline = L.polyline(grp.segs, {
            pane: modeConfig.pane,
            color: lineColor,
            weight: modeConfig.weight,
            opacity: 0.95,
            lineJoin: 'round',
            lineCap: 'round'
          });
          (layersByMode[grp.g] = layersByMode[grp.g] || L.layerGroup()).addLayer(polyline);
        }
      }

      addLineSet(DATA.lines.nr);
      addLineSet(DATA.lines.tfl);

      // Add layer groups to map in bottom‑to‑top order (z‑index reflects this)
      for (const mode of ['nationalrail', 'tram', 'dlr', 'overground', 'elizabeth', 'tube']) {
        if (layersByMode[mode]) layersByMode[mode].addTo(map);
      }

      // ---- Station markers (canvas icons, visible at z≥11) ----
      function createStationMarker(station) {
        const roundelHtml = getStationRoundelHtml(station);
        const icon = L.divIcon({
          className: 'multi-roundel-icon',
          html: roundelHtml,
          iconSize: null,
          iconAnchor: [0, 0]
        });
        const marker = L.marker([station.lat, station.lon], { icon, pane: 'stations' })
          .bindTooltip(station.name, { className: 'st', direction: 'top', offset: [0, -24] });
        marker._kind = station.kind;
        return marker;
      }

      function loadStationsInView() {
        const bounds = map.getBounds();
        const zoom = map.getZoom();
        const maxStations = zoom < 10 ? 100 : zoom < 12 ? 300 : zoom < 14 ? 800 : 2000;

        let visible = DATA.stations.filter(s =>
          s.lat >= bounds.getSouth() && s.lat <= bounds.getNorth() &&
          s.lon >= bounds.getWest() && s.lon <= bounds.getEast()
        );

        if (visible.length > maxStations) {
          const step = Math.ceil(visible.length / maxStations);
          visible = visible.filter((_, i) => i % step === 0);
        }

        // Replace current markers
        stationMarkers.forEach(m => stationLayer.removeLayer(m));
        stationMarkers.length = 0;

        for (const s of visible) {
          const mk = createStationMarker(s);
          stationMarkers.push(mk);
          stationLayer.addLayer(mk);
        }

        if (stationsEnabled && zoom >= 11) {
          stationLayer.addTo(map);
        }
      }

      let moveTimeout;
      map.on('moveend', () => {
        clearTimeout(moveTimeout);
        moveTimeout = setTimeout(() => {
          loadStationsInView();
          if (catchOn) {
            computeTrueDeserts();
          }
        }, 300);
      });

      function refreshStationVisibility() {
        const zoom = map.getZoom();
        const show = zoom >= 11;
        if (show && stationsEnabled && !map.hasLayer(stationLayer)) {
          loadStationsInView();
          stationLayer.addTo(map);
        } else if (!show && map.hasLayer(stationLayer)) {
          map.removeLayer(stationLayer);
        }
      }

      map.on('zoomend', refreshStationVisibility);
      loadStationsInView();

      // -------------------------------------------------------------------------
      // Catchment analysis (deserts / poor coverage)
      // -------------------------------------------------------------------------
      const desertLayer = L.layerGroup();
      let catchOn = false;

      // Helper to union an array of features using a highly efficient binary tree
      function unionAll(features) {
        if (!features || features.length === 0) return null;
        let list = [...features];
        while (list.length > 1) {
          const nextList = [];
          for (let i = 0; i < list.length; i += 2) {
            if (i + 1 < list.length) {
              try {
                const unioned = turf.union(list[i], list[i + 1]);
                if (unioned) {
                  nextList.push(unioned);
                } else {
                  nextList.push(list[i], list[i + 1]);
                }
              } catch (e) {
                nextList.push(list[i], list[i + 1]);
              }
            } else {
              nextList.push(list[i]);
            }
          }
          if (nextList.length === list.length) {
            break; // No progress made to prevent infinite loops on union errors
          }
          list = nextList;
        }
        return combineIntoMultiPolygon(list);
      }

      function combineIntoMultiPolygon(features) {
        if (!features || features.length === 0) return null;
        if (features.length === 1) return features[0];

        const multiCoords = [];
        for (const f of features) {
          if (!f.geometry) continue;
          const geom = f.geometry;
          if (geom.type === 'Polygon') {
            multiCoords.push(geom.coordinates);
          } else if (geom.type === 'MultiPolygon') {
            multiCoords.push(...geom.coordinates);
          }
        }
        return multiCoords.length > 0 ? turf.multiPolygon(multiCoords) : null;
      }

      function computeTrueDeserts() {
        if (!catchOn) return;
        desertLayer.clearLayers();

        if (window.desertTimeout) clearTimeout(window.desertTimeout);

        const zoom = map.getZoom();
        if (zoom < 11) {
          showNotification("Zoom in to see catchment deserts (zoom ≥ 11).");
          catchOn = false;
          catchBtn.classList.remove('on');
          return;
        }

        const bounds = map.getBounds();

        if (!DATA.deserts || !Array.isArray(DATA.deserts)) return;

        const visibleCentroids = DATA.desertCentroids.filter(p => bounds.contains([p.lat, p.lon]));
        if (visibleCentroids.length === 0) return;

        const visibleIndices = visibleCentroids.map(p => p.index);
        const visibleRings = visibleIndices.map(i => DATA.deserts[i]);
        const resPolygons = visibleRings.map(ring => turf.polygon(ring));

        // Show spinner / loading indicator
        document.getElementById('spin').style.display = 'flex';
        document.getElementById('spin').innerHTML = '<div class="b"></div>Computing catchment deserts...';

        // Run asynchronously to allow browser layout rendering of spinner
        window.desertTimeout = setTimeout(() => {
          try {
            const extBounds = bounds.pad(0.1);
            // Filter stations by enabled modes
            const enabledModes = new Set();
            for (const [mode, layer] of Object.entries(layersByMode)) {
              if (map.hasLayer(layer)) enabledModes.add(mode);
            }
            const stations = DATA.stations.filter(s => enabledModes.has(s.kind) && extBounds.contains([s.lat, s.lon]));

            if (stations.length === 0) {
              showNotification("No stations in view – all residential areas are deserts.");
              // Still draw all residential polygons as deserts
              if (resPolygons.length > 0) {
                const allDesert = unionAll(resPolygons);
                if (allDesert) {
                  L.geoJSON(allDesert, {
                    pane: 'deserts',
                    style: { stroke: false, fillColor: '#ff3366', fillOpacity: 0.5 },
                    interactive: false
                  }).addTo(desertLayer);
                }
              }
              desertLayer.addTo(map);
              document.getElementById('spin').style.display = 'none';
              return;
            }

            // Build union of station 800m buffers
            let stationCoverage = null;
            for (const s of stations) {
              const buf = turf.buffer(turf.point([s.lon, s.lat]), 0.8, { units: 'kilometers' });
              if (!stationCoverage) stationCoverage = buf;
              else stationCoverage = turf.union(stationCoverage, buf);
            }

            // Subtract from each residential polygon
            const desertFragments = [];
            for (const poly of resPolygons) {
              if (!stationCoverage) {
                desertFragments.push(poly);
              } else {
                try {
                  const diff = turf.difference(poly, stationCoverage);
                  if (diff) desertFragments.push(diff);
                } catch (e) {
                  // Skip problematic polygons
                }
              }
            }

            if (desertFragments.length > 0) {
              const allDesert = unionAll(desertFragments);
              if (allDesert) {
                L.geoJSON(allDesert, {
                  pane: 'deserts',
                  style: { stroke: false, fillColor: '#ff3366', fillOpacity: 0.5 },
                  interactive: false
                }).addTo(desertLayer);
              }
            }
            desertLayer.addTo(map);
          } catch (err) {
            console.error("Desert computation error", err);
          } finally {
            document.getElementById('spin').style.display = 'none';
          }
        }, 300);
      }

      const catchBtn = document.getElementById('catchBtn');

      catchBtn.onclick = () => {
        catchOn = !catchOn;
        catchBtn.classList.toggle('on', catchOn);
        if (catchOn) {
          computeTrueDeserts();
        } else {
          map.removeLayer(desertLayer);
          desertLayer.clearLayers();
        }
      };

      // -------------------------------------------------------------------------
      // Station placement optimisation (greedy facility location / clustering)
      // -------------------------------------------------------------------------
      function optimizeStationPlacement() {
        if (!DATA.deserts || !Array.isArray(DATA.deserts)) return [];
        const bounds = map.getBounds();
        const visibleCentroids = DATA.desertCentroids.filter(p => bounds.contains([p.lat, p.lon]));
        if (visibleCentroids.length === 0) return [];
        const visibleRings = visibleCentroids.map(p => DATA.deserts[p.index]);
        const resPolygons = visibleRings.map(ring => turf.polygon(ring));

        const extBounds = bounds.pad(0.1);
        const stations = DATA.stations.filter(s => extBounds.contains([s.lat, s.lon]));
        let stationCoverage = null;
        for (const s of stations) {
          const buf = turf.buffer(turf.point([s.lon, s.lat]), 0.8, { units: 'kilometers' });
          if (!stationCoverage) stationCoverage = buf;
          else stationCoverage = turf.union(stationCoverage, buf);
        }

        // Combine residential polygons into single feature for subtraction
        let residentialUnion = resPolygons[0];
        for (let i = 1; i < resPolygons.length; i++) {
          residentialUnion = turf.union(residentialUnion, resPolygons[i]);
        }
        if (!residentialUnion) return [];

        let uncovered = stationCoverage ? turf.difference(residentialUnion, stationCoverage) : residentialUnion;
        if (!uncovered) return [];

        const proposed = [];
        const maxProposed = 25;
        const minArea = 5000; // 5000 m²

        for (let iter = 0; iter < maxProposed; iter++) {
          let bestArea = 0, bestCentroid = null, bestBuffer = null;
          // Use centroids of visible residential rings as candidates
          for (const c of visibleCentroids) {
            const pt = turf.point([c.lon, c.lat]);
            if (!turf.booleanPointInPolygon(pt, uncovered)) continue;
            const buf = turf.buffer(pt, 0.8, { units: 'kilometers' });
            const inter = turf.intersect(buf, uncovered);
            if (!inter) continue;
            const area = turf.area(inter);
            if (area > bestArea) {
              bestArea = area;
              bestCentroid = c;
              bestBuffer = buf;
            }
          }
          if (bestArea < minArea) break;
          proposed.push({
            lat: bestCentroid.lat,
            lon: bestCentroid.lon,
            name: `Potential Station ${proposed.length+1}`
          });
          uncovered = turf.difference(uncovered, bestBuffer);
          if (!uncovered) break;
        }
        return proposed;
      }

      document.getElementById('optimizeBtn').onclick = () => {
        const newStations = optimizeStationPlacement();

        // Remove previous TfL connections if any
        if (window.connectionsLayer) {
          map.removeLayer(window.connectionsLayer);
          window.connectionsLayer = null;
        }

        // Remove previous proposals
        proposedStations.forEach(m => stationLayer.removeLayer(m));
        proposedStations.length = 0;

        // Add new proposals as glowing markers
        for (const s of newStations) {
          const marker = L.marker([s.lat, s.lon], {
            icon: L.divIcon({
              className: '',
              html: `<div style="width:14px;height:14px;background:var(--accent);border-radius:50%;border:3px solid #fff;box-shadow:0 0 12px var(--accent);"></div>`,
              iconSize: [14, 14],
              iconAnchor: [7, 7]
            }),
            pane: 'proposed'
          }).bindTooltip(s.name, { className: 'st', direction: 'top', offset: [0, -8] });
          proposedStations.push(marker);
          stationLayer.addLayer(marker);
        }

        if (stationsEnabled) stationLayer.addTo(map);

        showNotification(`Optimization complete: ${newStations.length} new stations proposed.`);
      };

      // -------------------------------------------------------------------------
      // Network efficiency analysis
      // -------------------------------------------------------------------------
      function analyzeEfficiency() {
        const totalStations = DATA.stations.length;
        const tramStations = DATA.stations.filter(s => s.kind === 'tram').length;
        const areaDeg = (UK_BOUNDS.maxLat - UK_BOUNDS.minLat) * (UK_BOUNDS.maxLon - UK_BOUNDS.minLon);
        const density = (totalStations / areaDeg).toFixed(2);
        const interchangeCount = DATA.stations.filter(s => s.lines && s.lines.length > 1).length;

        const content = document.getElementById('efficiencyContent');
        content.innerHTML = `
      <div class="eff-item">
        <div class="eff-label">Total Stations</div>
        <div class="eff-value">${totalStations}</div>
      </div>
      <div class="eff-item">
        <div class="eff-label">Tram Stops (800m buffers)</div>
        <div class="eff-value">${tramStations}</div>
      </div>
      <div class="eff-item">
        <div class="eff-label">Network Density</div>
        <div class="eff-value">${density} stations/deg²</div>
      </div>
      <div class="eff-item">
        <div class="eff-label">Interchange Stations</div>
        <div class="eff-value">${interchangeCount}</div>
      </div>
      <div class="eff-item">
        <div class="eff-label">Coverage Efficiency</div>
        <div class="eff-value ${tramStations > 50 ? 'eff-good' : 'eff-bad'}">
          ${tramStations > 50 ? 'Good' : 'Needs improvement'}
        </div>
      </div>
    `;

        document.getElementById('efficiencyPanel').classList.add('show');
      }

      document.getElementById('efficiencyBtn').onclick = analyzeEfficiency;

      // -------------------------------------------------------------------------
      // TfL‑style connections between proposed and existing stations
      // -------------------------------------------------------------------------
      function createTFLConnections() {
        if (proposedStations.length === 0) {
          showNotification('Please optimize station placement first.');
          return;
        }

        // Clear any existing connections
        if (window.connectionsLayer) {
          map.removeLayer(window.connectionsLayer);
          window.connectionsLayer = null;
        }
        window.connectionsLayer = L.layerGroup();

        for (const marker of proposedStations) {
          const sLatLng = marker.getLatLng();
          const ptA = turf.point([sLatLng.lng, sLatLng.lat]);

          // Find nearest line in the existing network
          let nearestLine = null;
          let minDistance = Infinity;
          let nearestPt = null;

          const allLines = [...DATA.lines.tfl, ...DATA.lines.nr];
          for (const line of allLines) {
            if (line.p.length < 2) continue;

            // Bounding box check for speed
            const margin = 0.05;
            if (sLatLng.lat < line.bbox.minLat - margin || sLatLng.lat > line.bbox.maxLat + margin ||
              sLatLng.lng < line.bbox.minLon - margin || sLatLng.lng > line.bbox.maxLon + margin) {
              continue;
            }

            const lineString = turf.lineString(line.p.map(pt => [pt[1], pt[0]]));
            try {
              const snapped = turf.nearestPointOnLine(lineString, ptA);
              const dist = snapped.properties.dist;
              if (dist < minDistance) {
                minDistance = dist;
                nearestLine = line;
                nearestPt = snapped;
              }
            } catch (e) {
              // Ignore snapping errors
            }
          }

          if (nearestPt && nearestLine) {
            // Find tangent neighbor point on the line
            const index = nearestPt.properties.index;
            const pPrev = nearestLine.p[index]; // [lat, lon]
            const pSnapped = [nearestPt.geometry.coordinates[1], nearestPt.geometry.coordinates[0]]; // [lat, lon]

            // Control point C: slide along the track direction from snapped point towards the neighbor
            // C = pSnapped + 0.5 * (pPrev - pSnapped)
            const latC = pSnapped[0] + 0.5 * (pPrev[0] - pSnapped[0]);
            const lonC = pSnapped[1] + 0.5 * (pPrev[1] - pSnapped[1]);

            // Define points for Bezier curve: [A, C, Snapped]
            // We need coordinates in [lon, lat] for Turf
            const rawCoords = [
              [sLatLng.lng, sLatLng.lat],
              [lonC, latC],
              [pSnapped[1], pSnapped[0]]
            ];

            const lineToSpline = turf.lineString(rawCoords);
            try {
              const smoothConnection = turf.bezierSpline(lineToSpline, {
                resolution: 500
              });

              L.geoJSON(smoothConnection, {
                pane: 'tfl',
                style: {
                  color: '#00d4ff',
                  weight: 3.5,
                  opacity: 0.85,
                  dashArray: '4, 6',
                  lineCap: 'round',
                  lineJoin: 'round'
                }
              }).addTo(window.connectionsLayer);
            } catch (e) {
              // Fallback to straight dashed line if Bezier fails
              L.polyline([
                [sLatLng.lat, sLatLng.lng],
                [pSnapped[0], pSnapped[1]]
              ], {
                color: '#00d4ff',
                weight: 3,
                opacity: 0.8,
                dashArray: '5, 8',
                pane: 'tfl'
              }).addTo(window.connectionsLayer);
            }
          }
        }

        window.connectionsLayer.addTo(map);
        showNotification(`TfL-style connections created.`);
      }

      document.getElementById('connectBtn').onclick = createTFLConnections;

      // -------------------------------------------------------------------------
      // Legend / layer toggles
      // -------------------------------------------------------------------------
      const togg = document.getElementById('toggles');

      function sampleColour(mode) {
        for (const arr of [DATA.lines.tfl, DATA.lines.nr]) {
          for (const f of arr) {
            if (f.g === mode) return f.c || MODES[mode].baseColor;
          }
        }
        return MODES[mode].baseColor;
      }

      function createLegendRow(mode) {
        const cfg = MODES[mode];
        const row = document.createElement('label');
        row.className = 'row';

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = true;
        cb.onchange = () => {
          const layer = layersByMode[mode];
          if (!layer) return;
          if (cb.checked) layer.addTo(map);
          else map.removeLayer(layer);
        };
        cb.addEventListener('change', () => { if (catchOn) computeTrueDeserts(); });

        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.background = sampleColour(mode);

        const label = document.createElement('span');
        label.textContent = cfg.label;

        row.append(cb, swatch, label);
        return row;
      }

      // TfL group
      const tflTitle = document.createElement('div');
      tflTitle.className = 'group-title';
      tflTitle.textContent = 'Transport for London';
      togg.append(tflTitle);

      ['tube', 'overground', 'elizabeth', 'dlr', 'tram'].forEach(mode => {
        if (layersByMode[mode]) togg.append(createLegendRow(mode));
      });

      // National Rail group
      const nrTitle = document.createElement('div');
      nrTitle.className = 'group-title';
      nrTitle.textContent = 'National Rail';
      togg.append(nrTitle);
      togg.append(createLegendRow('nationalrail'));

      // Station markers toggle
      const stTitle = document.createElement('div');
      stTitle.className = 'group-title';
      stTitle.textContent = 'Stations';
      togg.append(stTitle);

      const stationRow = document.createElement('label');
      stationRow.className = 'row';

      const stCb = document.createElement('input');
      stCb.type = 'checkbox';
      stCb.checked = true;
      stCb.onchange = () => {
        stationsEnabled = stCb.checked;
        if (stCb.checked) refreshStationVisibility();
        else map.removeLayer(stationLayer);
      };

      const stIco = document.createElement('span');
      stIco.className = 'mode-ico';
      stIco.innerHTML = `<img src="${getSvgDataUrl('underground')}" width="20" height="20">`;

      const stLabel = document.createElement('span');
      stLabel.textContent = 'Station markers';

      stationRow.append(stCb, stIco, stLabel);
      togg.append(stationRow);

      // -------------------------------------------------------------------------
      // Stats bar
      // -------------------------------------------------------------------------
      const counts = {};
      for (const s of DATA.stations) counts[s.kind] = (counts[s.kind] || 0) + 1;
      document.getElementById('stats').innerHTML =
        `<b>${DATA.stations.length}</b> stations · <b>${(DATA.lines.tfl.length + DATA.lines.nr.length).toLocaleString()}</b> segments · <b>${counts.tram || 0}</b> tram stops`;

      // Hide loading spinner
      document.getElementById('spin').style.display = 'none';
    }
  </script>
</body>

</html>
