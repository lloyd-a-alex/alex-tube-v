[package]
name = "alexs-tube-v"
version = "1.0.0"
edition = "2021"
authors = ["Alex"]
description = "London Transport network visualiser and spatial analysis engine — interactive map, A* pathfinding, demand modelling, and disruption simulation."
license = "MIT"
repository = "https://github.com/alextube/alex-tube-v"
keywords = ["london", "transport", "tube", "spatial", "map"]
categories = ["visualization", "science::geo"]
documentation = "https://docs.rs/alexs-tube-v"

[dependencies]
# Web Framework
axum = "0.8"
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }

# JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
toml = "0.8"

# Geometry & Spatial
geo = "0.28"
rstar = "0.12"

# Async Utilities
async-trait = "0.1"

# Tracing
tracing = "0.1"

# Memory Allocator
mimalloc = { version = "0.1", default-features = false }

# Binary Serialization
bincode = "1.3"

# Security: cryptographic hash for cache integrity verification
sha2 = "0.10"

# Utilities
chrono = "0.4"
thiserror = "1.0"
dirs = "5.0"
phf = { version = "0.14", features = ["macros"] }

# Performance
rayon = "1.8"
bytemuck = { version = "1.14", features = ["derive"] }
rkyv = { version = "0.7", features = ["validation"] }
crossbeam-channel = "0.5"

# Desktop
dioxus = { version = "0.5", features = ["fullstack", "axum", "desktop"] }
arc-swap = "1.7"
r2d2 = "0.8"
memmap2 = "0.9"
open = "5"


[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "astar_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
# Security: catch integer overflow in release builds (prevents silent wraparound exploits)
overflow-checks = true
# Maximum performance: single codegen unit enables whole-program optimization
debug = false
# Smallest possible binary
split-debuginfo = "off"

[profile.dev]
opt-level = 1
# Debug builds also benefit from overflow checks (default on, but explicit)
overflow-checks = true

[features]
default = []
server = ["dioxus/axum"]
web = []
