[package]
name = "alexs-tube-v"
version = "1.0.0"
edition = "2021"
authors = ["Alex"]
description = "London Transport network visualiser and spatial analysis engine — interactive map, A* pathfinding, demand modelling, and disruption simulation."
license = "MIT"
repository = "https://github.com/alextube/alex-tube-v"
keywords = ["london", "transport", "tube", "spatial", "map"]
categories = ["visualization", "science::geo"]
documentation = "https://docs.rs/alexs-tube-v"

[dependencies]
# Web Framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# Database
rusqlite = { version = "0.40", features = ["bundled"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }

# JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
toml = "1.1"

# Geometry & Spatial
geo = "0.33"
rstar = "0.13"

# Async Utilities
async-trait = "0.1"

# Tracing
tracing = "0.1"

# Memory Allocator
mimalloc = { version = "0.1", default-features = false }

# Binary Serialization
bincode = "1.3"

# Security: cryptographic hash for cache integrity verification
sha2 = "0.10"

# Utilities
chrono = "0.4"
thiserror = "2.0"
dirs = "6.0"
phf = { version = "0.14", features = ["macros"] }

# Performance
rayon = "1.12"
bytemuck = { version = "1.25", features = ["derive"] }
rkyv = { version = "0.7", features = ["validation"] }
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
rustc-hash = "2"

# Desktop (optional, enabled by default via 'desktop' feature)
dioxus = { version = "0.5", features = ["fullstack", "axum", "desktop"], optional = true }
arc-swap = "1.9"
r2d2 = "0.8"
memmap2 = "0.9"
open = "5"

# Shuttle deployment (optional, enabled via 'shuttle' feature)
shuttle-runtime = { version = "0.50", optional = true }
shuttle-axum = { version = "0.49", optional = true }
# Note: shuttle-shared-db is omitted for now to avoid libsqlite3-sys conflicts.
# SQLite caching is used for both desktop and shuttle builds.

# Utility crates for new engine modules (occupancy, disruption, demand, etc.)
fastrand = "2.4"
rand = "0.8"

# Memory pinning (mlock on Unix)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "astar_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
# Security: catch integer overflow in release builds (prevents silent wraparound exploits)
overflow-checks = true
# Maximum performance: single codegen unit enables whole-program optimization
debug = false
# Smallest possible binary
split-debuginfo = "off"

[profile.dev]
opt-level = 1
# Debug builds also benefit from overflow checks (default on, but explicit)
overflow-checks = true

[features]
default = ["desktop"]
desktop = ["dioxus"]
shuttle = ["shuttle-runtime", "shuttle-axum"]
server = ["dioxus/axum"]
web = []

[lints.clippy]
multiple-crate-versions = "allow"
needless-return = "allow"
redundant-pub-crate = "allow"
default-numeric-fallback = "allow"
float-arithmetic = "allow"
integer-division = "allow"
indexing-slicing = "allow"
arithmetic-side-effects = "allow"
question-mark-used = "allow"
min-ident-chars = "allow"
print-stdout = "allow"
unwrap-used = "allow"
as-conversions = "allow"
cast-possible-truncation = "allow"
cast-possible-wrap = "allow"
cast-sign-loss = "allow"
cast-precision-loss = "allow"
cast-lossless = "allow"
allow-attributes = "allow"
allow-attributes-without-reason = "allow"
