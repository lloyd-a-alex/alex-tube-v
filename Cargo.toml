[package]
name = "london-transport-network"
version = "1.0.0"
edition = "2021"

[dependencies]
# Web Framework
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# HTTP Client
reqwest = { version = "0.11", features = ["json"] }

# JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
toml = "0.8"

# Geometry & Spatial
geo = "0.28"
geo-types = "0.7"
rstar = "0.12"

# Async Utilities
futures = "0.3"
async-trait = "0.1"

# Caching
lru = "0.12"
moka = { version = "0.12", features = ["future"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = "0.4"
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
dirs = "5.0"
phf = { version = "0.11", features = ["macros"] }

# Performance
rayon = "1.8"
parking_lot = "0.12"

# URL encoding
percent-encoding = "2.3"
fs2 = "0.4"
scopeguard = "1.2"
dioxus = { version = "0.5", features = ["fullstack", "axum", "desktop"] }
arc-swap = "1.7"
r2d2 = "0.8"
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[features]
default = []
server = ["dioxus/axum"]
web = []
